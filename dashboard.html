<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Extvify Dashboard | Analytics</title>
  <!-- Chart.js CDN for interactive graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c15;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2rem;
      color: #fff;
    }

    .dashboard-container, .login-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Login panel (same style) */
    .login-container {
      background: #0f1119;
      border-radius: 1.5rem;
      border: 1px solid rgba(88, 101, 242, 0.2);
      padding: 2rem;
      text-align: center;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
      max-width: 450px;
      margin: 0 auto;
    }

    .login-container h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #fff, #b0c0ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      background: #13161f;
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: 0.8rem;
      color: white;
      font-family: inherit;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus {
      border-color: #5865f2;
    }

    button {
      background: linear-gradient(105deg, #5865f2, #4752c4);
      border: none;
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      border-radius: 2rem;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: linear-gradient(105deg, #6d7eff, #535fdb);
      transform: scale(0.98);
    }

    .error {
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 0.8rem;
    }

    /* Dashboard header */
    .dashboard-header {
      margin-bottom: 2rem;
    }

    .dashboard-header h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #fff, #b0c0ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .dashboard-header p {
      color: #9a9fc0;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* Stats cards grid (2 cards) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #0f1119;
      border-radius: 1.25rem;
      border: 1px solid rgba(88, 101, 242, 0.15);
      padding: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #5865f2;
      box-shadow: 0 12px 28px rgba(88, 101, 242, 0.2);
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b9cff;
      margin-bottom: 0.75rem;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .stat-trend {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .trend-up {
      color: #3ba55c;
    }

    .trend-down {
      color: #ed4245;
    }

    .trend-neutral {
      color: #9a9fc0;
    }

    /* Chart container */
    .chart-container {
      background: #0f1119;
      border-radius: 1.25rem;
      border: 1px solid rgba(88, 101, 242, 0.1);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .chart-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b9cff;
      margin-bottom: 1rem;
    }

    canvas {
      max-height: 300px;
      width: 100%;
    }

    /* Recent activity table */
    .recent-section {
      background: #0f1119;
      border-radius: 1.25rem;
      border: 1px solid rgba(88, 101, 242, 0.1);
      padding: 1.2rem;
      margin-top: 0.5rem;
    }

    .recent-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b9cff;
      margin-bottom: 1rem;
    }

    .recent-table {
      width: 100%;
      border-collapse: collapse;
    }

    .recent-table th,
    .recent-table td {
      text-align: left;
      padding: 0.6rem 0.2rem;
      font-size: 0.8rem;
      color: #e0e5ff;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .recent-table th {
      color: #8a8fb0;
      font-weight: 500;
    }

    /* Logout button */
    .flex-end {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    .logout-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      margin-top: 0;
      width: auto;
      padding: 0.6rem 1.2rem;
      display: inline-block;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    @media (max-width: 700px) {
      body { padding: 1rem; }
      .stats-grid { grid-template-columns: 1fr; gap: 1rem; }
      .stat-number { font-size: 2rem; }
      .chart-container { padding: 0.8rem; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
  (function() {
    const VALID_USER = "extvify";
    const VALID_PASS = "extvify12345";

    // ----- Helper functions for stats and history -----
    function getStats() {
      const clicks = parseInt(localStorage.getItem('extvify_pageViews') || 0);
      const redirects = parseInt(localStorage.getItem('extvify_redirects') || 0);
      return { clicks, redirects };
    }

    // Get previous day's stats (stored at midnight)
    function getPreviousStats() {
      const prevClicks = parseInt(localStorage.getItem('extvify_prev_clicks') || 0);
      const prevRedirects = parseInt(localStorage.getItem('extvify_prev_redirects') || 0);
      return { clicks: prevClicks, redirects: prevRedirects };
    }

    function updatePreviousStats(current) {
      localStorage.setItem('extvify_prev_clicks', current.clicks);
      localStorage.setItem('extvify_prev_redirects', current.redirects);
    }

    // Daily history: store an array of { date, clicks, redirects }
    function getDailyHistory() {
      const stored = localStorage.getItem('extvify_daily_history');
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch(e) { return []; }
      }
      return [];
    }

    function saveDailyHistory(history) {
      localStorage.setItem('extvify_daily_history', JSON.stringify(history));
    }

    // Add today's stats to history (if not already added today)
    function updateDailyHistory() {
      const todayStr = new Date().toISOString().slice(0,10);
      const history = getDailyHistory();
      const { clicks, redirects } = getStats();
      const existingIndex = history.findIndex(entry => entry.date === todayStr);
      if (existingIndex !== -1) {
        history[existingIndex] = { date: todayStr, clicks, redirects };
      } else {
        history.push({ date: todayStr, clicks, redirects });
      }
      // keep only last 30 days
      while (history.length > 30) history.shift();
      saveDailyHistory(history);
    }

    // Generate chart data for last 7 days (or less)
    function getLast7DaysHistory() {
      const history = getDailyHistory();
      // sort by date
      history.sort((a,b) => new Date(a.date) - new Date(b.date));
      const last7 = history.slice(-7);
      // fill missing days? optional: just use available data
      return last7;
    }

    function percentChange(current, previous) {
      if (previous === 0) return current === 0 ? 0 : 100;
      return ((current - previous) / previous) * 100;
    }

    function formatPercent(value) {
      return value.toFixed(1) + '%';
    }

    // ----- Chart instance and update -----
    let clicksChart = null;

    function renderChart() {
      const ctx = document.getElementById('clicksChart')?.getContext('2d');
      if (!ctx) return;
      const history = getLast7DaysHistory();
      const labels = history.map(entry => entry.date.slice(5)); // "MM-DD"
      const clicksData = history.map(entry => entry.clicks);
      const redirectsData = history.map(entry => entry.redirects);

      if (clicksChart) clicksChart.destroy();
      clicksChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Clicks',
              data: clicksData,
              borderColor: '#5865f2',
              backgroundColor: 'rgba(88, 101, 242, 0.1)',
              borderWidth: 2,
              tension: 0.3,
              fill: true,
              pointBackgroundColor: '#5865f2',
              pointBorderColor: '#fff',
              pointRadius: 3,
              pointHoverRadius: 5,
            },
            {
              label: 'Redirects',
              data: redirectsData,
              borderColor: '#f5b042',
              backgroundColor: 'rgba(245, 176, 66, 0.05)',
              borderWidth: 2,
              tension: 0.3,
              fill: true,
              pointBackgroundColor: '#f5b042',
              pointBorderColor: '#fff',
              pointRadius: 3,
              pointHoverRadius: 5,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { labels: { color: '#e0e5ff', font: { family: 'Space Grotesk', size: 11 } } },
            tooltip: { mode: 'index', intersect: false, backgroundColor: '#1a1c2a', titleColor: '#fff', bodyColor: '#c0c5e0' }
          },
          scales: {
            x: { ticks: { color: '#9a9fc0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#9a9fc0' }, grid: { color: 'rgba(255,255,255,0.05)' } }
          }
        }
      });
    }

    // ----- UI Rendering -----
    let updateInterval = null;

    function updateDashboardNumbers() {
      const { clicks, redirects } = getStats();
      const prev = getPreviousStats();
      const clicksChange = percentChange(clicks, prev.clicks);
      const redirectsChange = percentChange(redirects, prev.redirects);

      const clicksNumberElem = document.querySelector('.stat-card:first-child .stat-number');
      const redirectsNumberElem = document.querySelector('.stat-card:last-child .stat-number');
      const clicksTrendElem = document.querySelector('.stat-card:first-child .stat-trend');
      const redirectsTrendElem = document.querySelector('.stat-card:last-child .stat-trend');

      if (clicksNumberElem) clicksNumberElem.innerText = clicks.toLocaleString();
      if (redirectsNumberElem) redirectsNumberElem.innerText = redirects.toLocaleString();

      if (clicksTrendElem) {
        clicksTrendElem.innerHTML = `
          <span class="${clicksChange > 0 ? 'trend-up' : (clicksChange < 0 ? 'trend-down' : 'trend-neutral')}">
            ${clicksChange === 0 ? '→' : (clicksChange > 0 ? '▲' : '▼')} ${formatPercent(Math.abs(clicksChange))}
          </span>
          <span style="color:#6a6f90">vs previous</span>
        `;
      }
      if (redirectsTrendElem) {
        redirectsTrendElem.innerHTML = `
          <span class="${redirectsChange > 0 ? 'trend-up' : (redirectsChange < 0 ? 'trend-down' : 'trend-neutral')}">
            ${redirectsChange === 0 ? '→' : (redirectsChange > 0 ? '▲' : '▼')} ${formatPercent(Math.abs(redirectsChange))}
          </span>
          <span style="color:#6a6f90">vs previous</span>
        `;
      }

      // Update recent activity table (today and previous)
      const todayRow = document.querySelector('.recent-table tbody tr:first-child td:nth-child(2)');
      const todayRedirectRow = document.querySelector('.recent-table tbody tr:first-child td:nth-child(3)');
      if (todayRow) todayRow.innerText = clicks.toLocaleString();
      if (todayRedirectRow) todayRedirectRow.innerText = redirects.toLocaleString();

      const prevRowClick = document.querySelector('.recent-table tbody tr:nth-child(2) td:nth-child(2)');
      const prevRowRedirect = document.querySelector('.recent-table tbody tr:nth-child(2) td:nth-child(3)');
      if (prevRowClick) prevRowClick.innerText = prev.clicks.toLocaleString();
      if (prevRowRedirect) prevRowRedirect.innerText = prev.redirects.toLocaleString();

      // Also update chart data (refresh chart with latest history)
      updateDailyHistory(); // ensure today's stats are in history
      renderChart();
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-container">
          <h1>Admin Login</h1>
          <input type="text" id="username" placeholder="Username" autocomplete="off">
          <input type="password" id="password" placeholder="Password">
          <button id="loginBtn">Login</button>
          <div id="errorMsg" class="error"></div>
        </div>
      `;
      document.getElementById('loginBtn').addEventListener('click', () => {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (user === VALID_USER && pass === VALID_PASS) {
          sessionStorage.setItem('extvify_auth', 'true');
          renderDashboard();
        } else {
          document.getElementById('errorMsg').innerText = 'Invalid credentials. Access denied.';
        }
      });
    }

    function renderDashboard() {
      if (updateInterval) clearInterval(updateInterval);
      const { clicks, redirects } = getStats();
      const prev = getPreviousStats();

      // Ensure daily history includes today
      updateDailyHistory();
      const history = getLast7DaysHistory();

      // Build table rows (today and previous day)
      const todayStr = new Date().toISOString().slice(0,10);
      const prevDate = new Date();
      prevDate.setDate(prevDate.getDate() - 1);
      const prevDateStr = prevDate.toISOString().slice(0,10);

      document.getElementById('app').innerHTML = `
        <div class="dashboard-container">
          <div class="dashboard-header">
            <h1>Dashboard</h1>
            <p>Analytics, campaigns, and earnings at a glance.</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">CLICKS</div>
              <div class="stat-number">${clicks.toLocaleString()}</div>
              <div class="stat-trend"></div>
            </div>
            <div class="stat-card">
              <div class="stat-label">REDIRECTS</div>
              <div class="stat-number">${redirects.toLocaleString()}</div>
              <div class="stat-trend"></div>
            </div>
          </div>
          <div class="chart-container">
            <div class="chart-title">LAST 7 DAYS ACTIVITY</div>
            <canvas id="clicksChart" style="width:100%; max-height:300px;"></canvas>
          </div>
          <div class="recent-section">
            <div class="recent-title">RECENT ACTIVITY</div>
            <table class="recent-table">
              <thead>
                <tr><th>Date</th><th>Clicks</th><th>Redirects</th></tr>
              </thead>
              <tbody>
                <tr><td>${todayStr}</td><td>${clicks.toLocaleString()}</td><td>${redirects.toLocaleString()}</td></tr>
                <tr><td>${prevDateStr}</td><td>${prev.clicks.toLocaleString()}</td><td>${prev.redirects.toLocaleString()}</td></tr>
              </tbody>
            </table>
          </div>
          <div class="flex-end">
            <button id="logoutBtn" class="logout-btn">Logout</button>
          </div>
        </div>
      `;

      // Update trend texts
      updateDashboardNumbers();

      // Chart already rendered inside updateDashboardNumbers, but ensure it's called after DOM ready
      setTimeout(() => {
        updateDailyHistory();
        renderChart();
      }, 100);

      // Daily previous stats update (once per day)
      const lastUpdate = localStorage.getItem('extvify_last_update');
      const now = Date.now();
      if (!lastUpdate || (now - parseInt(lastUpdate)) > 24 * 60 * 60 * 1000) {
        updatePreviousStats({ clicks, redirects });
        localStorage.setItem('extvify_last_update', now);
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (updateInterval) clearInterval(updateInterval);
        sessionStorage.removeItem('extvify_auth');
        renderLogin();
      });

      // Live updates every 8 seconds
      updateInterval = setInterval(() => {
        updateDashboardNumbers();
      }, 8000);
    }

    if (sessionStorage.getItem('extvify_auth') === 'true') {
      renderDashboard();
    } else {
      renderLogin();
    }
  })();
</script>
</body>
</html>
