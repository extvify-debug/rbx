<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nitro Rewards · Claim access</title>
  <style>
    /* ----- fonts & base reset (no functional changes) ----- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Syne:wght@500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at 30% 10%, #0B0E1A 0%, #05070F 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #EDF2FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* animated noise texture & gradient flow — pure visual upgrade */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-radial-gradient(circle at 20% 30%, rgba(88, 101, 242, 0.08) 0px, transparent 2px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 40% 30%, rgba(0, 255, 196, 0.08), transparent 55%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      width: min(880px, 100%);
      position: relative;
      z-index: 2;
    }

    /* main card — glassmorphic, border glow, elevated */
    .card {
      background: rgba(12, 16, 28, 0.68);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      border: 1px solid rgba(114, 137, 218, 0.35);
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(88, 101, 242, 0.2) inset, 0 0 24px rgba(88, 101, 242, 0.25);
      padding: 2rem 2rem 2rem 2rem;
      transition: box-shadow 0.3s ease;
    }

    /* header area with modern badge */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.4rem;
    }

    .badge {
      background: linear-gradient(135deg, #2b2f47, #1a1d2f);
      border-radius: 1.2rem;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 25px -8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(88, 101, 242, 0.45);
    }

    .badge svg {
      width: 30px;
      height: 30px;
      stroke: #8b9cff;
      stroke-width: 1.8;
      fill: none;
    }

    h1 {
      font-family: 'Syne', 'Inter', sans-serif;
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF, #C0D0FF);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #A7B2E0;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* option row - distinct cards-like */
    .option-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .option-btn {
      background: rgba(20, 25, 45, 0.75);
      border: 1px solid rgba(114, 137, 218, 0.4);
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      color: #F0F4FF;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      backdrop-filter: blur(5px);
    }

    .option-btn .title-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(88, 101, 242, 0.6));
    }

    .option-btn .opt-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .option-btn:hover {
      border-color: #6d8eff;
      background: rgba(45, 55, 95, 0.85);
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -12px rgba(88, 101, 242, 0.4);
    }

    .option-btn.active {
      background: linear-gradient(105deg, rgba(88, 101, 242, 0.25), rgba(48, 58, 150, 0.6));
      border-color: #7d95ff;
      box-shadow: 0 0 12px rgba(109, 142, 255, 0.5);
    }

    /* choices layout */
    .choices {
      display: grid;
      gap: 1.2rem;
      margin: 1.5rem 0 0.5rem;
    }

    .choices.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .choices.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .choice-card {
      background: rgba(16, 20, 35, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(114, 137, 218, 0.3);
      border-radius: 1.5rem;
      padding: 1.2rem;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      position: relative;
    }

    .choice-card:hover {
      transform: translateY(-4px);
      border-color: #7289da;
      background: rgba(30, 36, 60, 0.85);
      box-shadow: 0 20px 32px -18px #5865f2;
    }

    .choice-card.active {
      border-color: #6d8eff;
      background: linear-gradient(145deg, rgba(88, 101, 242, 0.2), rgba(38, 42, 80, 0.9));
      box-shadow: 0 0 0 1px #6d8eff, 0 12px 28px -8px #5865f2;
    }

    .choice-badge {
      position: absolute;
      top: -8px;
      right: 12px;
      background: #ffb347;
      background: linear-gradient(135deg, #F9B43A, #FB8C00);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #0a0c1a;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .choice-icon {
      background: rgba(0, 0, 0, 0.4);
      width: 70px;
      height: 70px;
      border-radius: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.2rem;
    }

    .choice-icon img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .choice-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .choice-price {
      background: rgba(0, 255, 200, 0.12);
      padding: 0.2rem 0.9rem;
      border-radius: 100px;
      font-weight: 700;
      color: #C0FFE0;
      font-size: 0.8rem;
    }

    .choice-sub {
      font-size: 0.75rem;
      color: #abb4e6;
      line-height: 1.3;
    }

    /* actions & buttons */
    .actions {
      margin-top: 1.8rem;
      text-align: center;
    }

    .generate-btn {
      background: linear-gradient(105deg, #5c6eff, #3644b0);
      border: none;
      padding: 0.9rem 1.8rem;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 3rem;
      color: white;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 18px -6px #2f3bb0;
      letter-spacing: 0.3px;
    }

    .generate-btn:not(:disabled):hover {
      background: linear-gradient(105deg, #7182ff, #4150c4);
      transform: scale(0.98);
      box-shadow: 0 8px 20px -5px #5c6eff;
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.1);
    }

    .actions-note {
      font-size: 0.8rem;
      color: #9ba6d9;
      margin-top: 0.7rem;
    }

    /* progress */
    .progress {
      margin-top: 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 1.8rem;
      padding: 1rem 1.2rem;
      backdrop-filter: blur(4px);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(109, 142, 255, 0.3);
      border-top-color: #6d8eff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .status {
      font-weight: 600;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #202433;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6d8eff, #a27eff);
      border-radius: 20px;
      transition: width 0.2s linear;
    }

    /* modal modern */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 15, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.hidden {
      display: none;
    }

    .modal-card {
      background: #0f1222e6;
      border: 1px solid #35447c;
      border-radius: 2rem;
      padding: 1.8rem;
      width: min(400px, 90%);
      box-shadow: 0 35px 45px -10px black;
    }

    .input-label {
      display: block;
      margin: 1rem 0 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #username-input {
      width: 100%;
      background: #020617b3;
      border: 1px solid #2e3b6e;
      border-radius: 1.2rem;
      padding: 0.8rem 1rem;
      color: white;
      font-size: 1rem;
    }

    #username-input.validated {
      border-color: #36d680;
      box-shadow: 0 0 10px #36d68055;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid #5a6bbd;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      color: white;
      cursor: pointer;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      text-align: center;
      color: #7b86b0;
    }

    .disabled {
      pointer-events: none;
      opacity: 0.6;
    }

    .hidden {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      .option-row {
        grid-template-columns: 1fr;
      }
      .choices.two, .choices.three {
        grid-template-columns: 1fr;
      }
      .card {
        padding: 1.2rem;
      }
      .choice-card {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-start;
        text-align: left;
        gap: 0.4rem;
      }
      .choice-icon {
        width: 48px;
        height: 48px;
        margin-right: 0.8rem;
      }
      .choice-badge {
        position: relative;
        top: 0;
        right: auto;
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <header class="header">
      <div class="badge">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none">
          <path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2Z" />
          <path d="M12 5L13.5 9L18 9.5L14.5 12.5L15.5 17L12 14.5L8.5 17L9.5 12.5L6 9.5L10.5 9L12 5Z" />
        </svg>
      </div>
      <div>
        <h1>Nitro Rewards</h1>
        <p class="subtitle">verify & claim · exclusive access</p>
      </div>
    </header>

    <!-- screen 1: platform selection -->
    <div id="screen-1">
      <div class="option-row">
        <button class="option-btn" id="opt-1" data-option="1">
          <span class="opt-title">
            <img class="title-icon" src="https://i.postimg.cc/xCzsZjkr/470pg7.webp" alt="discord" />
            Discord Nitro
          </span>
        </button>
        <button class="option-btn" id="opt-2" data-option="2">
          <span class="opt-title">
            <img class="title-icon" src="https://i.postimg.cc/KvyWdTD8/es95yi.webp" alt="robux" />
            Robux
          </span>
        </button>
      </div>
    </div>

    <!-- screen 2: dynamic reward cards -->
    <div id="screen-2" class="hidden"></div>

    <!-- actions block: generate button -->
    <div id="actions" class="actions hidden">
      <button class="generate-btn" id="generate-btn" disabled>Select reward first</button>
      <p class="actions-note">✨ choose a reward to continue</p>
    </div>

    <!-- progress simulation -->
    <div id="progress" class="progress hidden">
      <div class="progress-row">
        <div class="spinner"></div>
        <div class="status" id="status-text">Starting verification</div>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <div class="status-sub" id="status-sub" style="font-size:0.75rem; margin-top: 10px;"></div>
    </div>
  </div>
  <footer>⚡ Rewards secured · 919 claimed today</footer>

  <!-- username modal -->
  <div id="name-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="name-title" style="font-family: 'Syne';">Enter your username</h2>
      <label class="input-label">username (min 3 characters)</label>
      <input id="username-input" type="text" placeholder="e.g., Luxx" autocomplete="off" />
      <p class="modal-status" id="modal-status" style="font-size:0.75rem; margin-top:6px;"></p>
      <div class="modal-actions">
        <button class="ghost-btn" id="cancel-btn">Cancel</button>
        <button class="generate-btn" id="confirm-btn" disabled>Continue</button>
      </div>
    </div>
  </div>
</main>

<script>
  (function() {
    // --- constants (functional unchanged)
    const REDIRECT_URL = "https://rainawards.com/ow/69bf833f2d6a708a36f234d5";

    // DOM elements
    const opt1 = document.getElementById('opt-1');
    const opt2 = document.getElementById('opt-2');
    const screen1 = document.getElementById('screen-1');
    const screen2 = document.getElementById('screen-2');
    const actionsDiv = document.getElementById('actions');
    const generateBtn = document.getElementById('generate-btn');
    const actionsNote = document.querySelector('.actions-note');
    const progressDiv = document.getElementById('progress');
    const statusText = document.getElementById('status-text');
    const statusSub = document.getElementById('status-sub');
    const barFill = document.getElementById('bar-fill');
    const nameModal = document.getElementById('name-modal');
    const usernameInput = document.getElementById('username-input');
    const confirmBtn = document.getElementById('confirm-btn');
    const modalStatus = document.getElementById('modal-status');
    const nameTitle = document.getElementById('name-title');
    const cancelBtn = document.getElementById('cancel-btn');

    // state
    let selectedChoice = null;
    let selectedPlatform = null; // "DISCORD" or "ROBLOX"
    let currentOptionKey = null;

    // Reward data (exactly original)
    const optionData = {
      1: [
        { title: "Nitro Basic", price: "$29.99", desc: "Essentials: emojis, stickers, and 50MB upload", iconType: "img", icon: "https://i.postimg.cc/T1bZnqjV/1cc22811-2ac2-4749-8dfe-501bd4dce238.webp" },
        { title: "Nitro Boost", price: "$99.99", desc: "Everything plus boosts, 4K streaming, and perks", badge: "Best Value", iconType: "img", icon: "https://i.postimg.cc/3JgsR1xh/nitroboost.webp" }
      ],
      2: [
        { title: "450 Robux", desc: "Perfect for avatar items and game passes", iconType: "img", icon: "https://i.postimg.cc/1RgP9DFD/robux-1.webp" },
        { title: "1500 Robux", desc: "Ideal for bundles, boosts, and cosmetics", iconType: "img", icon: "https://i.postimg.cc/1RgP9DFD/robux-1.webp" },
        { title: "4500 Robux", desc: "Best option for bundles, passes, and more", badge: "Best Value", iconType: "img", icon: "https://i.postimg.cc/1RgP9DFD/robux-1.webp" }
      ]
    };

    // progress steps (same timing behavior)
    const progressSteps = [
      { label: "Preparing secure gateway...", sub: "Initializing", min: 1200, max: 2200, target: 22 },
      { label: "Verifying credentials...", sub: "Cross-checking reward pool", min: 1400, max: 2600, target: 48 },
      { label: "Finalizing allocation...", sub: "Redirecting verification", min: 1700, max: 3000, target: 76 },
      { label: "Almost there...", sub: "Confirming username", min: 1600, max: 3000, target: 96 },
      { label: "Unlocking reward", sub: "Redirecting now", min: 900, max: 1400, target: 100 }
    ];

    function rand(min, max) {
      return Math.floor(min + Math.random() * (max - min + 1));
    }

    // building choice cards
    function buildChoices(optionKey) {
      const items = optionData[optionKey];
      if (!items) return;
      const classes = items.length === 2 ? "choices two" : "choices three";
      screen2.className = classes;
      screen2.innerHTML = "";
      items.forEach((item, idx) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "choice-card";
        card.style.setProperty("--delay", `${idx * 70}ms`);
        const badgeMark = item.badge ? `<span class="choice-badge">${item.badge}</span>` : "";
        const priceMark = item.price ? `<div class="choice-price">${item.price}</div>` : "";
        card.innerHTML = `
          ${badgeMark}
          <div class="choice-icon"><img src="${item.icon}" alt="${item.title}" /></div>
          <div class="choice-title">${item.title}</div>
          ${priceMark}
          <div class="choice-sub">${item.desc}</div>
        `;
        card.addEventListener("click", (e) => {
          e.stopPropagation();
          selectChoice(card, item);
        });
        screen2.appendChild(card);
      });
    }

    function selectChoice(card, item) {
      document.querySelectorAll('.choice-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedChoice = item;
      if (generateBtn) {
        generateBtn.disabled = false;
        generateBtn.textContent = `🎁 Claim ${item.title}`;
        if (actionsNote) actionsNote.classList.add('hidden');
      }
    }

    function showChoices(optionKey) {
      currentOptionKey = optionKey;
      // update active state on platform buttons
      [opt1, opt2].forEach(btn => {
        if (btn.dataset.option === optionKey) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      selectedPlatform = optionKey === "1" ? "DISCORD" : "ROBLOX";
      screen2.classList.remove('hidden');
      actionsDiv.classList.remove('hidden');
      generateBtn.disabled = true;
      generateBtn.textContent = "✨ Select reward";
      if (actionsNote) actionsNote.classList.remove('hidden');
      selectedChoice = null;
      buildChoices(optionKey);
    }

    function disableInputs(disabled = true) {
      const method = disabled ? 'add' : 'remove';
      [opt1, opt2].forEach(b => b.classList[method]('disabled'));
      if (screen2) {
        document.querySelectorAll('.choice-card').forEach(c => c.classList[method]('disabled'));
      }
      if (generateBtn) generateBtn.classList[method]('disabled');
    }

    function normalizeDurations(steps) {
      const total = steps.reduce((s, step) => s + step.duration, 0);
      const minTotal = 900, maxTotal = 1500;
      if (total >= minTotal && total <= maxTotal) return;
      const target = rand(minTotal, maxTotal);
      const ratio = target / total;
      steps.forEach(step => { step.duration = Math.max(120, Math.round(step.duration * ratio)); });
    }

    function startProgress() {
      disableInputs(true);
      if (progressDiv) progressDiv.classList.remove('hidden');
      const steps = progressSteps.map(step => ({
        ...step,
        duration: rand(step.min, step.max),
        pause: rand(45, 95)
      }));
      normalizeDurations(steps);
      let idx = 0;
      function advance() {
        const step = steps[idx];
        if (statusText) statusText.textContent = step.label;
        if (statusSub) statusSub.textContent = step.sub;
        if (barFill) {
          barFill.style.transitionDuration = step.duration + "ms";
          barFill.style.width = step.target + "%";
        }
        const delay = step.duration + (step.pause || 50);
        if (idx >= steps.length - 1) {
          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, delay);
          return;
        }
        idx++;
        setTimeout(advance, delay);
      }
      advance();
    }

    function openModal() {
      if (!selectedChoice || !nameModal) return;
      nameModal.classList.remove('hidden');
      const platformLabel = selectedPlatform === "DISCORD" ? "DISCORD" : "ROBLOX";
      if (nameTitle) nameTitle.textContent = `🔐 Enter ${platformLabel} username`;
      usernameInput.value = "";
      usernameInput.classList.remove('validated');
      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.textContent = "Continue";
        confirmBtn.classList.remove('is-valid');
      }
      if (modalStatus) modalStatus.textContent = "";
      setTimeout(() => usernameInput.focus(), 30);
    }

    function closeModal() {
      if (nameModal) nameModal.classList.add('hidden');
    }

    // Event handlers (functional flow identical)
    opt1.addEventListener('click', () => showChoices('1'));
    opt2.addEventListener('click', () => showChoices('2'));

    if (generateBtn) generateBtn.addEventListener('click', openModal);
    if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

    // Username validation with same logic & visual improvement
    if (usernameInput && confirmBtn) {
      let validationTimer = null;
      const applyValidation = (value) => {
        const isValid = value.length >= 3;
        usernameInput.classList.toggle('validated', isValid);
        confirmBtn.disabled = !isValid;
        confirmBtn.textContent = isValid ? "✅ Validate & Claim" : "Continue";
        if (modalStatus) modalStatus.textContent = isValid ? "✓ Username ready" : "⛔ at least 3 characters";
      };
      const validateUsername = () => {
        const rawValue = usernameInput.value.trim();
        if (validationTimer) clearTimeout(validationTimer);
        usernameInput.classList.remove('validated');
        confirmBtn.disabled = true;
        confirmBtn.textContent = rawValue ? "Verifying..." : "Continue";
        if (modalStatus) modalStatus.textContent = rawValue ? "Checking availability..." : "Enter username";
        if (!rawValue) return;
        validationTimer = setTimeout(() => {
          applyValidation(rawValue);
        }, 500);
      };
      usernameInput.addEventListener('input', validateUsername);
      usernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !confirmBtn.disabled) confirmBtn.click();
      });
    }

    confirmBtn?.addEventListener('click', () => {
      if (!usernameInput || !usernameInput.value.trim() || usernameInput.value.trim().length < 3) return;
      closeModal();
      startProgress();
    });

    // initial hidden states
    screen2.classList.add('hidden');
    actionsDiv.classList.add('hidden');
    progressDiv.classList.add('hidden');
    nameModal.classList.add('hidden');
  })();
</script>
</body>
</html>
