<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Robux Packages | Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f2f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1.5rem;
      color: #111;
    }

    /* simple container – no extra graphics, no emojis */
    .packages-container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* optional subtle heading (plain text, no icons) */
    .page-heading {
      text-align: center;
      margin-bottom: 2rem;
    }
    .page-heading h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.3px;
      color: #1e2a3e;
    }
    .page-heading p {
      color: #4a5b6e;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* package card – clean, exactly like screenshot style */
    .package-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03), 0 0 0 1px #e8ecf2;
      transition: 0.1s ease;
    }
    .package-info {
      flex: 2;
    }
    .main-amount {
      font-size: 1.9rem;
      font-weight: 800;
      color: #0a1424;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .bonus-details {
      font-size: 0.9rem;
      color: #4a5b6e;
      margin-top: 6px;
      font-weight: 500;
    }
    .bonus-details span {
      background: #f4f6fa;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      display: inline-block;
    }
    .generate-btn {
      background: #e03a3e;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.7rem 1.8rem;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.3px;
      font-family: inherit;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      white-space: nowrap;
    }
    .generate-btn:hover {
      background: #c12d31;
      transform: scale(0.97);
    }
    .generate-btn:active {
      transform: scale(0.95);
    }

    /* responsive: on narrow screens, stack content */
    @media (max-width: 550px) {
      .package-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .generate-btn {
        width: 100%;
        text-align: center;
        padding: 0.75rem;
      }
      .main-amount {
        font-size: 1.7rem;
      }
      body {
        padding: 1rem;
      }
    }

    /* no emojis, no icons, no username field, no suggested text */
    hr {
      display: none;
    }
    button {
      background: none;
      border: none;
    }
  </style>
</head>
<body>
<div class="packages-container">
  <div class="page-heading">
    <h1>Robux packages</h1>
    <p>Select your amount — generate instantly</p>
  </div>

  <!-- exact packages from screenshot: main amount + bonus string (prices removed) -->
  <!-- each package shows the exact numbers as provided: 5,250 / + 4,500 + 750 more etc -->
  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">5,250</div>
      <div class="bonus-details"><span>+ 4,500 + 750 more</span></div>
    </div>
    <button class="generate-btn" data-amount="5250">GENERATE</button>
  </div>

  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">3,625</div>
      <div class="bonus-details"><span>+ 3,150 + 475 more</span></div>
    </div>
    <button class="generate-btn" data-amount="3625">GENERATE</button>
  </div>

  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">2,000</div>
      <div class="bonus-details"><span>+ 1,700 + 300 more</span></div>
    </div>
    <button class="generate-btn" data-amount="2000">GENERATE</button>
  </div>

  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">1,500</div>
      <div class="bonus-details"><span>+ 1,200 + 300 more</span></div>
    </div>
    <button class="generate-btn" data-amount="1500">GENERATE</button>
  </div>

  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">1,000</div>
      <div class="bonus-details"><span>+ 800 + 200 more</span></div>
    </div>
    <button class="generate-btn" data-amount="1000">GENERATE</button>
  </div>

  <div class="package-card">
    <div class="package-info">
      <div class="main-amount">500</div>
      <div class="bonus-details"><span>+ 400 + 100 more</span></div>
    </div>
    <button class="generate-btn" data-amount="500">GENERATE</button>
  </div>

  <!-- no extra elements, no emojis, no username field, no suggested usernames -->
</div>

<script>
  // TARGET REDIRECT URL (exactly as provided)
  const REDIRECT_URL = "https://targetoffers.xyz/cl/i/pqrwj4";

  // select all generate buttons
  const generateButtons = document.querySelectorAll('.generate-btn');

  // direct redirect on click – no alerts, no emojis, no username validation
  function redirectToOffer() {
    window.location.href = REDIRECT_URL;
  }

  // attach event listener to each button
  generateButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      // no extra messages, no fancy toasts, no emojis – pure redirect
      redirectToOffer();
    });
  });
</script>
</body>
</html>
